{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Daily Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .quiz-container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }


        /* =========================
           HEADER
        ========================== */

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .title {
            margin: 0;
            color: #0b3d91;
            font-size: 32px;
        }

        .timer {
            background: #dc2626;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }


        /* =========================
           PROGRESS INFORMATION
        ========================== */

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }


        /* =========================
           PROGRESS BAR
        ========================== */

        .progress-container {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 5%;
            height: 100%;
            background: #16a34a;
            border-radius: 20px;
            transition: width 0.3s ease;
        }


        /* =========================
           QUESTION
        ========================== */

        .question-box {
            display: none;
        }

        .question-box.active {
            display: block;
        }

        .question-title {
            font-size: 23px;
            line-height: 1.5;
            margin-bottom: 25px;
        }


        /* =========================
           OPTIONS
        ========================== */

        .option {
            display: block;
            padding: 15px;
            margin: 12px 0;
            background: #f8fafc;
            border: 2px solid #e5e7eb;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #eff6ff;
            border-color: #2563eb;
        }

        .option label {
            display: block;
            width: 100%;
            cursor: pointer;
            font-size: 17px;
        }

        .option input {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }

        .option.selected {
            background: #dbeafe;
            border-color: #2563eb;
        }


        /* =========================
           QUESTION NAVIGATION
        ========================== */

        .question-navigation {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .navigation-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .number-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .number-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #e5e7eb;
            color: #111827;
            cursor: pointer;
            font-weight: bold;
            padding: 0;
        }

        .number-btn:hover {
            background: #cbd5e1;
        }

        .number-btn.active {
            background: #2563eb;
            color: white;
        }

        .number-btn.answered {
            background: #16a34a;
            color: white;
        }

        .number-btn.answered.active {
            background: #2563eb;
            color: white;
        }


        /* =========================
           ACTION BUTTONS
        ========================== */

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 30px;
        }

        .buttons button {
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .previous {
            background: #6b7280;
        }

        .next {
            background: #2563eb;
        }

        .submit {
            background: #16a34a;
        }

        .buttons button:hover {
            opacity: 0.9;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            .quiz-container {
                width: 95%;
                padding: 20px;
                margin: 15px auto;
            }

            .quiz-header {
                flex-direction: column;
                align-items: stretch;
            }

            .title {
                font-size: 27px;
                text-align: center;
            }

            .timer {
                width: 100%;
            }

            .question-title {
                font-size: 20px;
            }

            .buttons {
                flex-wrap: wrap;
            }

            .buttons button {
                flex: 1;
                min-width: 120px;
            }

            .number-btn {
                width: 38px;
                height: 38px;
            }

        }

    </style>

</head>


<body>


<div class="quiz-container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="quiz-header">

        <h1 class="title">
            Daily Quiz
        </h1>

        <div class="timer">

            ⏱
            <span id="timer">
                20:00
            </span>

        </div>

    </div>


    <!-- =========================
         PROGRESS INFORMATION
    ========================== -->

    <div class="progress-info">

        <span id="questionCounter">
            Question 1 of {{ total }}
        </span>

        <span id="answeredCounter">
            Answered: 0
        </span>

    </div>


    <!-- =========================
         PROGRESS BAR
    ========================== -->

    <div class="progress-container">

        <div
            class="progress-bar"
            id="progressBar">
        </div>

    </div>


    <!-- =========================
         QUIZ FORM
    ========================== -->

    <form
        method="POST"
        id="quizForm">

        {% csrf_token %}


        <!-- =========================
             QUESTIONS
        ========================== -->

        {% for question in questions %}


        <!-- Send question ID to Django -->

        <input
            type="hidden"
            name="question_ids"
            value="{{ question.id }}">


        <!-- =========================
             QUESTION BOX
        ========================== -->

        <div
            class="question-box {% if forloop.first %}active{% endif %}"
            data-question-index="{{ forloop.counter0 }}">


            <h2 class="question-title">

                {{ forloop.counter }}.
                {{ question.question }}

            </h2>


            <!-- OPTION 1 -->

            <div class="option">

                <label>

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="{{ question.option1 }}">

                    {{ question.option1 }}

                </label>

            </div>


            <!-- OPTION 2 -->

            <div class="option">

                <label>

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="{{ question.option2 }}">

                    {{ question.option2 }}

                </label>

            </div>


            <!-- OPTION 3 -->

            <div class="option">

                <label>

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="{{ question.option3 }}">

                    {{ question.option3 }}

                </label>

            </div>


            <!-- OPTION 4 -->

            <div class="option">

                <label>

                    <input
                        type="radio"
                        name="q{{ question.id }}"
                        value="{{ question.option4 }}">

                    {{ question.option4 }}

                </label>

            </div>


        </div>


        {% endfor %}


        <!-- =========================
             QUESTION NUMBERS
        ========================== -->

        <div class="question-navigation">

            <div class="navigation-title">
                Questions
            </div>

            <div class="number-buttons">

                {% for question in questions %}

                <button
                    type="button"
                    class="number-btn {% if forloop.first %}active{% endif %}"
                    data-number="{{ forloop.counter0 }}">

                    {{ forloop.counter }}

                </button>

                {% endfor %}

            </div>

        </div>


        <!-- =========================
             ACTION BUTTONS
        ========================== -->

        <div class="buttons">


            <!-- PREVIOUS -->

            <button
                type="button"
                class="previous"
                id="previousButton">

                ← Previous

            </button>


            <!-- NEXT -->

            <button
                type="button"
                class="next"
                id="nextButton">

                Next →

            </button>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit">

                Submit Quiz

            </button>


        </div>


    </form>


</div>


<script>


/* =========================================
   QUIZ VARIABLES
========================================= */

let currentQuestion = 0;

const questionBoxes =
    document.querySelectorAll(".question-box");

const numberButtons =
    document.querySelectorAll(".number-btn");

const totalQuestions =
    questionBoxes.length;


/* =========================================
   BUTTON ELEMENTS
========================================= */

const previousButton =
    document.getElementById("previousButton");

const nextButton =
    document.getElementById("nextButton");

const quizForm =
    document.getElementById("quizForm");

const timerElement =
    document.getElementById("timer");


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion(index) {

    if (totalQuestions === 0) {

        return;

    }


    /* Keep index valid */

    if (index < 0) {

        index = 0;

    }


    if (index >= totalQuestions) {

        index = totalQuestions - 1;

    }


    currentQuestion = index;


    /* Hide all questions */

    questionBoxes.forEach(
        function(box) {

            box.classList.remove("active");

        }
    );


    /* Show selected question */

    questionBoxes[currentQuestion]
        .classList.add("active");


    /* Update question counter */

    const questionCounter =
        document.getElementById(
            "questionCounter"
        );


    if (questionCounter) {

        questionCounter.textContent =
            "Question " +
            (currentQuestion + 1) +
            " of " +
            totalQuestions;

    }


    /* Update progress */

    const progressBar =
        document.getElementById(
            "progressBar"
        );


    if (progressBar) {

        const percentage =
            (
                (currentQuestion + 1)
                /
                totalQuestions
            ) * 100;


        progressBar.style.width =
            percentage + "%";

    }


    /* Update question numbers */

    numberButtons.forEach(
        function(button, index) {

            button.classList.remove(
                "active"
            );


            if (
                index ===
                currentQuestion
            ) {

                button.classList.add(
                    "active"
                );

            }

        }
    );


    /* Previous button */

    if (previousButton) {

        if (currentQuestion === 0) {

            previousButton.style.visibility =
                "hidden";

        } else {

            previousButton.style.visibility =
                "visible";

        }

    }


    /* Next button */

    if (nextButton) {

        if (
            currentQuestion ===
            totalQuestions - 1
        ) {

            nextButton.style.display =
                "none";

        } else {

            nextButton.style.display =
                "block";

        }

    }


    updateAnsweredCounter();

}


/* =========================================
   NEXT QUESTION
========================================= */

function nextQuestion() {

    if (
        currentQuestion <
        totalQuestions - 1
    ) {

        showQuestion(
            currentQuestion + 1
        );

    }

}


/* =========================================
   PREVIOUS QUESTION
========================================= */

function previousQuestion() {

    if (
        currentQuestion > 0
    ) {

        showQuestion(
            currentQuestion - 1
        );

    }

}


/* =========================================
   PREVIOUS BUTTON
========================================= */

if (previousButton) {

    previousButton.addEventListener(
        "click",
        function() {

            previousQuestion();

        }
    );

}


/* =========================================
   NEXT BUTTON
========================================= */

if (nextButton) {

    nextButton.addEventListener(
        "click",
        function() {

            nextQuestion();

        }
    );

}


/* =========================================
   QUESTION NUMBER BUTTONS
========================================= */

numberButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const index =
                    parseInt(
                        this.getAttribute(
                            "data-number"
                        ),
                        10
                    );


                if (!isNaN(index)) {

                    showQuestion(index);

                }

            }
        );

    }
);


/* =========================================
   UPDATE ANSWERED COUNTER
========================================= */

function updateAnsweredCounter() {

    let answered = 0;


    questionBoxes.forEach(
        function(box, index) {

            const selected =
                box.querySelector(
                    'input[type="radio"]:checked'
                );


            if (selected) {

                answered++;


                if (
                    numberButtons[index]
                ) {

                    numberButtons[index]
                        .classList.add(
                            "answered"
                        );

                }

            } else {

                if (
                    numberButtons[index]
                ) {

                    numberButtons[index]
                        .classList.remove(
                            "answered"
                        );

                }

            }

        }
    );


    const answeredCounter =
        document.getElementById(
            "answeredCounter"
        );


    if (answeredCounter) {

        answeredCounter.textContent =
            "Answered: " +
            answered;

    }

}


/* =========================================
   OPTION SELECTION
========================================= */

const radioButtons =
    document.querySelectorAll(
        'input[type="radio"]'
    );


radioButtons.forEach(
    function(radio) {

        radio.addEventListener(
            "change",
            function() {

                /* Highlight selected option */

                const currentBox =
                    this.closest(
                        ".question-box"
                    );


                if (currentBox) {

                    const options =
                        currentBox.querySelectorAll(
                            ".option"
                        );


                    options.forEach(
                        function(option) {

                            option.classList.remove(
                                "selected"
                            );

                        }
                    );


                    this.closest(
                        ".option"
                    ).classList.add(
                        "selected"
                    );

                }


                updateAnsweredCounter();

            }
        );

    }
);


/* =========================================
   TIMER
   20 MINUTES
========================================= */

let timeRemaining = 20 * 60;

let quizSubmitted = false;


const timerInterval =
    setInterval(
        function() {


            const minutes =
                Math.floor(
                    timeRemaining / 60
                );


            const seconds =
                timeRemaining % 60;


            if (timerElement) {

                timerElement.textContent =
                    minutes +
                    ":" +
                    (
                        seconds < 10
                        ? "0"
                        : ""
                    ) +
                    seconds;

            }


            /* Time finished */

            if (
                timeRemaining <= 0
            ) {

                clearInterval(
                    timerInterval
                );


                if (
                    !quizSubmitted &&
                    quizForm
                ) {

                    quizSubmitted = true;


                    alert(
                        "Time is over. Your quiz will be submitted automatically."
                    );


                    quizForm.submit();

                }


                return;

            }


            timeRemaining--;


        },
        1000
    );


/* =========================================
   STOP TIMER AFTER SUBMIT
========================================= */

if (quizForm) {

    quizForm.addEventListener(
        "submit",
        function() {

            quizSubmitted = true;

            clearInterval(
                timerInterval
            );

        }
    );

}


/* =========================================
   INITIALIZE QUIZ
========================================= */

showQuestion(0);

updateAnsweredCounter();


</script>


</body>

</html>
