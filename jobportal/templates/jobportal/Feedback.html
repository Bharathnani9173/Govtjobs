<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:20px;
        }

        .container{
            width:50%;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:#003366;
        }

        label{
            font-weight:bold;
        }

        input, textarea, select{
            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#003366;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0055aa;
        }

        .success{
            color:green;
            text-align:center;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Feedback Form</h1>

{% if messages %}
    {% for message in messages %}
        <p class="success">{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST" action="{% url 'feedback' %}">

    {% csrf_token %}

    <label>Full Name</label>
    <input type="text" name="name" placeholder="Enter your full name" required>

    <label>Email Address</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <div class="form-group">
    <label>Subject</label>
    <input type="text"
           name="subject"
           class="form-control"
           placeholder="Enter subject"
           required>
</div>

    <label>Rate Our Website (1-5)</label>
    <input type="number" name="rating" min="1" max="5" required>

    <label>Your Suggestions</label>
    <textarea name="message" rows="6" placeholder="Write your feedback here..." required></textarea>

    <button type="submit">Submit Feedback</button>

</form>

</div>

</body>
</html>
