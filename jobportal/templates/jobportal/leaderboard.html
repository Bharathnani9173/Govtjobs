<!DOCTYPE html>

<html>

<head>

<title>Leaderboard</title>


<style>

body{

font-family:Arial;
background:#f3f6fb;

}


.container{

width:70%;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;

}


table{

width:100%;
border-collapse:collapse;

}


th,td{

padding:15px;
text-align:center;
border-bottom:1px solid #ddd;

}


th{

background:#2563eb;
color:white;

}


</style>

</head>


<body>


<div class="container">


<h1>
🏆 Daily Quiz Leaderboard
</h1>


<table>


<tr>

<th>Rank</th>

<th>User</th>

<th>Score</th>

</tr>


{% for score in top_scores %}


<tr>

<td>
{{ forloop.counter }}
</td>


<td>
{{ score.user.username }}
</td>


<td>
{{ score.score }}/{{ score.total_questions }}
</td>


</tr>


{% endfor %}


</table>


</div>


</body>

</html>
