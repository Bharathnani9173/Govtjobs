<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Govt Jobs</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'jobportal/css/style.css' %}">

</head>

<body>

    <div class="login-container">

        <h2>Login</h2>

        {% if messages %}

            {% for message in messages %}

                <p>{{ message }}</p>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p>
            Don't have an account?
            <a href="/register/">Register</a>
        </p>

    </div>

</body>

</html>
