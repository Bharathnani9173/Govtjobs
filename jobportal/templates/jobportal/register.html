<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Govt Jobs</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'jobportal/css/style.css' %}">

</head>

<body>

    <div class="login-container">

        <h2>Create Account</h2>


        {% if messages %}

            {% for message in messages %}

                <p>{{ message }}</p>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >


            <button type="submit">

                Register

            </button>

        </form>


        <p>

            Already have an account?

            <a href="/login/">

                Login

            </a>

        </p>

    </div>

</body>

</html>
