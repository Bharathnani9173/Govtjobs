<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Govt Jobs</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'jobportal/css/style.css' %}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: #f3f6fa;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .login-container h2 {
            margin: 0 0 8px;
            color: #003366;
            text-align: center;
            font-size: 28px;
        }

        .form-subtitle {
            margin: 0 0 25px;
            color: #666666;
            text-align: center;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #333333;
            font-size: 15px;
            font-weight: 600;
        }

        .form-group input {
            display: block;
            width: 100%;
            min-height: 45px;
            padding: 11px 12px;
            border: 1px solid #cbd2da;
            border-radius: 6px;
            background: #ffffff;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #003366;
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.1);
        }

        .register-button {
            width: 100%;
            min-height: 46px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            background: #003366;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .register-button:hover {
            background: #004b8d;
        }

        .login-link {
            margin: 22px 0 0;
            color: #555555;
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #003366;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .messages p {
            padding: 10px;
            border-radius: 5px;
            background: #fff3cd;
            color: #664d03;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 20px;
            }

            .login-container h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Create Account</h2>

        <p class="form-subtitle">
            Register to access Govt Jobs services.
        </p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">1. Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">2. Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">3. Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">4. Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="register-button">
                Register
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login/">Login</a>
        </p>

    </div>

</body>
</html>
