<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Already Attempted</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:500px;
            background:white;
            padding:40px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        h1{
            color:#d32f2f;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            color:#555;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            padding:12px 25px;
            background:#007bff;
            color:white;
            text-decoration:none;
            border-radius:6px;
            font-size:18px;
        }

        a:hover{
            background:#0056b3;
        }
    </style>

</head>
<body>

<div class="card">

    <h1>Quiz Already Attempted</h1>

    <p>
        You have already completed today's Daily Quiz.<br><br>
        Please come back tomorrow for a new set of questions.
    </p>

    <a href="/">Go to Home</a>

</div>

</body>
</html>
