<!DOCTYPE html>

<html>

<head>

<title>Score History</title>


<style>

body{

font-family:Arial;
background:#f3f6fb;

}


.container{

width:70%;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;

}


table{

width:100%;
border-collapse:collapse;

}


th,td{

padding:15px;
text-align:center;
border-bottom:1px solid #ddd;

}


th{

background:#16a34a;
color:white;

}

</style>

</head>


<body>


<div class="container">


<h1>
📈 My Quiz History
</h1>


<table>


<tr>

<th>Date</th>

<th>Score</th>

</tr>



{% for attempt in attempts %}


<tr>

<td>
{{ attempt.attempted_date }}
</td>


<td>
{{ attempt.score }}/{{ attempt.total_questions }}
</td>


</tr>


{% empty %}


<tr>

<td colspan="2">
No quiz attempts yet
</td>

</tr>


{% endfor %}


</table>


</div>


</body>

</html>
